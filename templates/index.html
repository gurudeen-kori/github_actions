<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate</title>

    <style>
        body {
            margin: 0;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .certificate {
            width: 794px;
            height: 1123px;
            background: white;
            border: 12px solid #2c3e50;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            margin-top: 20px;
        }

        .title {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #2c3e50;
        }

        .subtitle {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
        }

        .name {
            text-align: center;
            font-size: 34px;
            color: #0072ff;
            margin: 40px 0;
            font-weight: bold;
            border-bottom: 2px solid #0072ff;
            display: inline-block;
            padding-bottom: 5px;
        }

        .content {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            margin-top: 20px;
        }

        .footer {
            position: absolute;
            bottom: 70px;
            width: 90%;
            display: flex;
            justify-content: space-between;
        }

        .signature {
            text-align: center;
        }

        .line {
            width: 200px;
            border-top: 2px solid black;
            margin: 10px auto;
        }

        .btn {
            margin: 20px;
            padding: 12px 25px;
            background: #0072ff;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        @media print {
            body {
                background: none;
            }
            .btn {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Download Button -->
    <button class="btn" onclick="window.print()">⬇ Download Certificate</button>

    <!-- Certificate -->
    <div class="certificate">

        <div class="title">Certificate of Completion</div>

        <div class="subtitle">This is to certify that</div>

        <!-- 🔥 NAME CHANGE HERE ONLY -->
        <div class="name" id="username">Gurudeen kori</div>

        <div class="content">
            has successfully completed the <br><br>
            <b>DevSecOps End-to-End Pipeline Project</b><br><br>
            demonstrating expertise in CI/CD, Docker, Security, and Cloud Deployment.
        </div>

        <div class="footer">
            <div class="signature">
                <div class="line"></div>
                <p>Instructor</p>
            </div>

            <div class="signature">
                <div class="line"></div>
                <p>Date</p>
            </div>
        </div>

    </div>

    <!-- Optional: Auto name change via URL -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");

        if (name) {
            document.getElementById("username").innerText = name;
        }
    </script>

</body>
</html>
