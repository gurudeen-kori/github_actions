<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Certificate</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .certificate-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .certificate-container img {
            width: 90%;
            height: auto;
            max-height: 90vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .download-btn {
            position: fixed;
            bottom: 30px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            font-size: 16px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="certificate-container">
        <img src="{{ url_for('static', filename='certificate.jpg') }}" alt="Certificate">
    </div>

    <a href="{{ url_for('static', filename='certificate.jpg') }}" download class="download-btn">
        Download Certificate
    </a>

</body>
</html>
