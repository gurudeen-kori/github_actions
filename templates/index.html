<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate</title>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            margin: 20px;
            padding: 12px 25px;
            background: #0072ff;
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .certificate-container {
            width: 794px;   /* A4 width */
            height: 1123px; /* A4 height */
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .certificate-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media print {
            body {
                background: none;
            }
            .btn {
                display: none;
            }
            .certificate-container {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <!-- Download Button -->
    <button class="btn" onclick="window.print()">⬇ Download Certificate</button>

    <!-- Certificate Image -->
    <div class="certificate-container">
        <img src="{{ url_for('static', filename='certificate.jpg') }}" alt="Certificate">
    </div>

</body>
</html>
