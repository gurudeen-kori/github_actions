<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- 🔥 Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate</title>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Button */
        .btn {
            margin: 15px;
            padding: 12px 20px;
            background: #0072ff;
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        /* Certificate Container */
        .certificate-container {
            width: 794px;
            height: 1123px;
            max-width: 95vw;   /* 🔥 mobile fit */
            height: auto;      /* 🔥 maintain ratio */
            aspect-ratio: 794 / 1123;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Image */
        .certificate-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .btn {
                width: 90%;
                font-size: 14px;
            }
        }

        /* Print */
        @media print {
            body {
                background: none;
            }

            .btn {
                display: none;
            }

            .certificate-container {
                width: 794px;
                height: 1123px;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <!-- Download Button -->
    <button class="btn" onclick="window.print()">⬇ Download Certificate</button>

    <!-- Certificate -->
    <div class="certificate-container">
        <img src="{{ url_for('static', filename='certificate.jpg') }}" alt="Certificate">
    </div>

</body>
</html>
