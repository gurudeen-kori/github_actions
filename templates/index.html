<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificate</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .certificate-container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .certificate-container h1 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #333;
        }

        .certificate-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        .download-btn {
            margin-top: 15px;
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .download-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="certificate-container">
    <h1>My Certificate</h1>

    <!-- Replace with your certificate image -->
    <img src="certificate.jpg" alt="Certificate" class="certificate-img">

    <!-- Optional download button -->
    <br>
    <a href="certificate.jpg" download class="download-btn">Download Certificate</a>
</div>

</body>
</html>
