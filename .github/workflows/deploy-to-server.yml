# this will deploy the safe / secure / tested app to prod server
name: Deploy to Server

on: 
    workflow_call:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code 
              uses: actions/checkout@v4


            - name: SSh to prod server and create app folder
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                script: |
                  echo "starting deployment"
                  sudo apt-get update 
                  sudo apt-get install docker.io docker-compose-v2 -y 
                  sudo usermod -aG docker $USER && newgrp docker
                  mkdir -p devops
                  
            - name: Copy the docker-compose file 
              uses: appleboy/scp-action@v1
              with: 
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                source: docker-compose.yml
                target: ~/devops 
                
            - name: ssh to prod server & run the app 
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                script: |
                  echo "running app "
                  
                  export DOCKER_USER=${{ secrets.DOCKER_USER }}
                  export DOCKER_TAG=${{ github.event.workflow_run.head_sha }}
                  echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
                  cd ~/devops && docker compose down && docker compose up -d --build --force-recreate --pull always
